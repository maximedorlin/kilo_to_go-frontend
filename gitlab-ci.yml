stages:
  - check
  - lint
  - test
  - build
  - deploy
  - notify

# Cache des dépendances npm et des images Docker
cache:
  key: ${CI_PROJECT_ID}
  paths:
    - node_modules/
    - .docker/

# Étape 1 : Vérification des conflits de fusion
check_conflicts:
  stage: check
  image: alpine:latest
  script:
    - git fetch origin main
    - if ! git merge --no-commit --no-ff origin/main; then
      echo "Des conflits de fusion ont été détectés.";
      exit 1;
      fi
  only:
    - merge_requests

# Étape 2 : Linter le code avec ESLint
# lint_next:

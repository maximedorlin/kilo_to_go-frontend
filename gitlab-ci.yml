#     - npm i --legacy-peer-deps
#     - npm run lint

# Étape 3 : Vérification des types avec TypeScript
type_check_js:
  stage: lint
  image: node:18-alpine
  cache:
    key: ${CI_PROJECT_ID}
    paths:
      - node_modules/
  script:
    - npm i --legacy-peer-deps
    # - npm run type-check
    - echo "types checked successfully"

# Étape 4 : Tests end-to-end avec Cypress
cypress_tests:
  stage: test
  image: cypress/included:10.3.0
  cache:
    key: ${CI_PROJECT_ID}
    paths:
      - node_modules/
  script:
    - npm i --legacy-peer-deps
    - npm run build # Construction de l'application Next.js pour les tests
    - npm start & # Lancement du serveur en arrière-plan
    - npx cypress run
  variables:
    CYPRESS_baseUrl: http://localhost:3000
  artifacts:
    when: always
    paths:
      - cypress/videos/* # Sauvegarde des vidéos des tests
      - cypress/screenshots/* # Sauvegarde des captures d'écran en cas d'échec
    expire_in: 1 week

# Étape 5 : Construction de l'application Next.js
build_next:
  stage: build
  image: node:18-alpine
  cache:
    key: ${CI_PROJECT_ID}
    paths:
      - node_modules/
  script:
    - npm i --legacy-peer-deps
    - npm run build # Génération des fichiers de production
  artifacts:
    paths:
      - .next
    expire_in: 1 week

